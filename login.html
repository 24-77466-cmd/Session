<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fieldwear — Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="authSection" class="auth-page">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <h2>Welcome back</h2>
      <p>Sign in to continue to Fieldwear</p>
      <span class="db-badge">● FIELDWEAR</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form">
      <label>
        <span>Email</span>
        <input type="email" id="loginEmail" placeholder="Email" required>
      </label>
      <label>
        <span>Password</span>
        <input type="password" id="loginPassword" placeholder="Password" required>
      </label>
      <button type="submit" class="btn-primary full">Log in</button>
      <p class="auth-switch">
        Don't have an account?
        <a href="#" id="goToRegister">Create one</a>
      </p>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form hidden">
      <label>
        <span>Full name</span>
        <input type="text" id="regName" placeholder="John Doe" required>
      </label>
      <label>
        <span>Email</span>
        <input type="email" id="regEmail" placeholder="you@example.com" required>
      </label>
      <label>
        <span>Password</span>
        <input type="password" id="regPassword" placeholder="Create a password" required minlength="4">
      </label>
      <button type="submit" class="btn-primary full">Register</button>
      <p class="auth-switch">
        Already have an account?
        <a href="#" id="goToLogin">Log in</a>
      </p>
    </form>

    <div id="authMessage" class="auth-message"></div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
